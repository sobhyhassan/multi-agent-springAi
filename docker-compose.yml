version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: hr_chatbot_db
    environment:
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: HrSecurePassword2026
      POSTGRES_DB: hr_chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
